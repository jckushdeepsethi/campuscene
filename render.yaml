services:
  - type: web
    name: campuscene-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_IA53RHBvogLk@ep-divine-base-az8cqm32-pooler.c-3.ap-southeast-1.aws.neon.tech/campusconnect?sslmode=require&channel_binding=require
      - key: DIRECT_URL
        value: postgresql://neondb_owner:npg_IA53RHBvogLk@ep-divine-base-az8cqm32.c-3.ap-southeast-1.aws.neon.tech/campusconnect?sslmode=require
      - key: FRONTEND_URL
        value: https://campuscene.in
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: EMAIL_FROM
        value: CampuScene <noreply@campuscene.edu>
